# Next.js 정적 사이트를 GitHub Pages(smartcitykorea.github.io/sck-web/)로 빌드/배포한다.
#
# 주의: actions/configure-pages 의 static_site_generator: next 옵션은 쓰지 않는다.
# 그 옵션은 next.config.js 를 새로 만들어 basePath 를 직접 주입하는데,
# 이 프로젝트는 next.config.ts + NEXT_PUBLIC_BASE_PATH 환경변수 조합으로 basePath 를
# 관리하고 있어서(lib/asset-path.ts 참고) 서로 충돌한다(이미지 경로 404 의 원인이었음).
# 대신 리포지토리 이름을 basePath 로 삼아 빌드 시 환경변수로 직접 넘긴다.
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build with Next.js
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npx next build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
